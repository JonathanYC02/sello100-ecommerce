<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizador | SELLO 100</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Rutas relativas hacia atrás -->
    <link rel="stylesheet" href="../css/main.css">
    <style>
        /* Estilos específicos para el personalizador */
        .editor-container {
            display: flex;
            height: 100vh;
            padding-top: 80px; /* Espacio para la navbar */
        }

        .sidebar {
            width: 300px;
            background: var(--bg-card);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            padding: 2rem;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-family: var(--font-title);
            color: var(--gold-primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .design-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .design-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .design-item:hover, .design-item.active {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .design-item img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            position: relative;
        }

        /* El contenedor de la camiseta */
        .tshirt-wrapper {
            position: relative;
            width: 500px;
            height: 600px;
            max-width: 90vw;
            max-height: 80vh;
        }

        .tshirt-mockup {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none; /* Para que no bloquee el arrastre */
            z-index: 1;
        }

        /* El área donde se pondrá el diseño */
        .design-canvas {
            position: absolute;
            top: 30%; /* Ajustar según la maqueta */
            left: 35%;
            width: 30%;
            height: 40%;
            z-index: 2;
            /* border: 1px dashed red; <- Descomenta para ver el área de estampado */
        }

        #draggable-design {
            position: absolute;
            cursor: grab;
            max-width: 100%;
            top: 0;
            left: 0;
            display: none; /* Oculto hasta que elijan un diseño */
        }
        
        #draggable-design:active {
            cursor: grabbing;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
    </style>
</head>
<body>
    <!-- Fondo Animado -->
    <div class="bg-grid"></div>
    
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none; color: inherit; display: flex; align-items: center; gap: 10px;">
                
                <span class="logo-text">SELLO 100</span>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Catálogo</a></li>
            <li><a href="personalizar.html" class="active">Personalizar</a></li>
        </ul>
    </nav>

    <!-- Editor -->
    <main class="editor-container">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <h3>1. Elige tu diseño</h3>
            <div class="design-grid">
                <!-- Usaremos imágenes de prueba por ahora -->
                <div class="design-item" onclick="selectDesign('https://i.imgur.com/8YV2w7o.png')">
                    <img src="https://i.imgur.com/8YV2w7o.png" alt="Diseño Fe">
                </div>
                <div class="design-item" onclick="selectDesign('https://i.imgur.com/3Q2Y3wP.png')">
                    <img src="https://i.imgur.com/3Q2Y3wP.png" alt="Diseño Cruz">
                </div>
                <!-- Puedes añadir más -->
            </div>

            <h3>2. Ajusta tu diseño</h3>
            <p style="font-size: 0.8rem; color: #888; margin-bottom: 1rem;">Arrastra con el mouse o el dedo para mover. Usa los botones para ajustar el tamaño.</p>
            
            <div class="controls">
                <button class="btn-secondary" onclick="scaleDesign(0.1)"><i class="fa-solid fa-plus"></i> Aumentar tamaño</button>
                <button class="btn-secondary" onclick="scaleDesign(-0.1)"><i class="fa-solid fa-minus"></i> Reducir tamaño</button>
                <button class="btn-secondary" onclick="centerDesign()"><i class="fa-solid fa-crosshairs"></i> Centrar</button>
            </div>

            <button class="btn-gold btn-full" style="margin-top: 2rem;" onclick="guardarPersonalizacion()">Añadir al Carrito</button>
        </aside>

        <!-- Área de Trabajo -->
        <section class="canvas-area">
            <div class="tshirt-wrapper">
                <!-- Maqueta de camiseta (puedes cambiar esta imagen por una tuya en mockups/) -->
                <img src="https://cdn.pixabay.com/photo/2016/11/23/18/38/tshirt-1854933_1280.png" alt="Camiseta Base" class="tshirt-mockup">
                
                <div class="design-canvas" id="design-area">
                    <img id="draggable-design" src="" alt="Diseño a estampar">
                </div>
            </div>
        </section>
    </main>

    <script src="../js/personalizar.js"></script>
</body>
</html>
